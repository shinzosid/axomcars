<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axom Cars | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Login overlay style */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h1 { margin-bottom: 20px; font-size: 24px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body class="admin-body">

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h1>Admin Login</h1>
            <input type="email" id="adminEmail" placeholder="Enter Email">
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button id="loginBtn" onclick="checkAuth()">Login</button>
            <p id="loginError" style="color: red; margin-top: 10px; display: none;">Invalid Credentials</p>
        </div>
    </div>

    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="Axom Cars" class="admin-logo">
            <span class="admin-title">Leads Dashboard</span>
        </div>
        <button class="btn-clear" onclick="logout()">Logout</button>
    </header>

    <main class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <div class="value" id="totalLeads">0</div>
            </div>
            <div class="stat-card">
                <h3>Leads Today</h3>
                <div class="value" id="leadsTodayCount">0</div>
            </div>
        </div>

        <div class="leads-table-container">
            <div class="table-header-actions">
                <h2>Customer Inquiries</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="typeFilter" onchange="renderLeads()" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd; outline: none; font-family: 'Poppins', sans-serif;">
                        <option value="all">All Types</option>
                        <option value="Test Drive">Test Drive</option>
                        <option value="Service">Service</option>
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Newsletter Signup">Newsletter</option>
                    </select>
                    <select id="dateFilter" onchange="renderLeads()" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd; outline: none; font-family: 'Poppins', sans-serif;">
                        <option value="all">All Time</option>
                        <option value="current">Current Month</option>
                        <option value="last3">Last 3 Months</option>
                    </select>
                    <button class="btn-export" onclick="exportToCSV()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Download Sheet
                    </button>
                </div>
            </div>
            <div id="tableWrapper">
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Model</th>
                            <th>Outlet</th>
                        </tr>
                    </thead>
                    <tbody id="leadsBody">
                        <!-- Leads will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        // Check auth state on load
        async function checkAuthState() {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('loginOverlay').style.display = 'none';
                renderLeads();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        }

        window.supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('loginOverlay').style.display = 'none';
                renderLeads();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        async function checkAuth() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');

            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            error.style.display = 'none';

            try {
                const { error: authError } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });
                if (authError) throw authError;
            } catch (err) {
                console.error(err);
                error.textContent = err.message;
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        // Add Enter key listener
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginOverlay').style.display !== 'none') {
                checkAuth();
            }
        });

        async function logout() {
            await window.supabaseClient.auth.signOut();
            location.reload();
        }

        async function renderLeads() {
            const body = document.getElementById('leadsBody');
            const totalEl = document.getElementById('totalLeads');
            const latestEl = document.getElementById('leadsTodayCount');
            const filterValue = document.getElementById('dateFilter').value;
            const typeFilterValue = document.getElementById('typeFilter') ? document.getElementById('typeFilter').value : 'all';

            body.innerHTML = '<tr><td colspan="6" class="empty-state">Loading leads...</td></tr>';

            try {
                // Fetch from Supabase
                const { data: leads, error } = await window.supabaseClient
                    .from('leads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Filter logic
                const now = new Date();
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                const threeMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 3, 1);

                const filteredLeads = leads.filter(lead => {
                    const leadTime = new Date(lead.created_at);
                    let passDate = true;
                    if (filterValue === 'current') {
                        passDate = leadTime >= startOfMonth;
                    } else if (filterValue === 'last3') {
                        passDate = leadTime >= threeMonthsAgo;
                    }
                    
                    let passType = true;
                    if (typeFilterValue !== 'all') {
                        const leadType = lead.source || 'Inquiry';
                        if (typeFilterValue === 'General Inquiry' && (leadType.includes('General') || leadType.includes('Inquiry'))) {
                            passType = true;
                        } else {
                            passType = leadType.includes(typeFilterValue);
                        }
                    }
                    
                    return passDate && passType;
                });

                // Update Stats
                totalEl.textContent = filteredLeads.length;
                
                // Calculate Leads Today
                const startOfToday = new Date().setHours(0, 0, 0, 0);
                const todayLeads = filteredLeads.filter(l => new Date(l.created_at).getTime() >= startOfToday);
                latestEl.textContent = todayLeads.length;

                if (filteredLeads.length === 0) {
                    body.innerHTML = '<tr><td colspan="6" class="empty-state">No leads found.</td></tr>';
                    return;
                }

                body.innerHTML = filteredLeads.map(lead => {
                    const date = new Date(lead.created_at).toLocaleString('en-IN');
                    const type = lead.source?.includes('Service') ? 'Service' : (lead.source?.includes('Test Drive') ? 'Test Drive' : 'Inquiry');
                    return `
                        <tr>
                            <td style="font-size: 11px; white-space: nowrap;">${date}</td>
                            <td><span style="background: ${type === 'Test Drive' ? '#fff4f4' : (type === 'Service' ? '#eef6fc' : '#f4fff4')}; color: ${type === 'Test Drive' ? '#e74c3c' : (type === 'Service' ? '#1d70b8' : '#27ae60')}; padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; border: 1px solid currentColor;">${type.toUpperCase()}</span></td>
                            <td style="font-weight: 600;">${lead.name || 'N/A'}</td>
                            <td style="font-weight: 600;">${lead.phone || 'N/A'}</td>
                            <td><span style="background: #e1e7ec; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${(lead.vehicle || 'N/A').toUpperCase()}</span></td>
                            <td style="font-weight: 600;">${(lead.location || 'N/A').toUpperCase()}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error("Error fetching leads: ", error);
                body.innerHTML = '<tr><td colspan="6" class="empty-state" style="color: red;">Error loading leads. Check console.</td></tr>';
            }
        }

        async function exportToCSV() {
            const { data: leads, error } = await window.supabaseClient
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !leads.length) {
                alert('No leads to export.');
                return;
            }

            const headers = ['Date', 'Source', 'Name', 'Phone', 'Vehicle', 'Location'];
            const rows = leads.map(l => [
                `"${new Date(l.created_at).toLocaleString('en-IN')}"`, 
                `"${l.source || ''}"`, 
                `"${l.name || ''}"`, 
                `"${l.phone || ''}"`, 
                `"${l.vehicle || ''}"`, 
                `"${l.location || ''}"`
            ]);

            let csvContent = "data:text/csv;charset=utf-8," 
                + headers.join(",") + "\n"
                + rows.map(e => e.join(",")).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "axom_leads_" + new Date().toLocaleDateString() + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial auth check
        checkAuthState();
    </script>
</body>
</html>
