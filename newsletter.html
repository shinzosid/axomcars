<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axom Cars Newsroom | Latest Tata Motors Updates</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Newsroom Styles */
        .newsroom-container {
            max-width: 1200px;
            margin: 100px auto 40px;
            padding: 40px 20px;
            font-family: 'Poppins', sans-serif;
        }

        .news-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            grid-auto-rows: 300px;
            gap: 20px;
            margin-bottom: 60px;
        }

        .news-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #222;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .news-card.featured {
            grid-row: span 2;
        }

        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .news-card:hover .card-bg {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
        }

        .card-content {
            position: relative;
            z-index: 3;
            padding: 30px;
            color: #fff;
        }

        .tag-latest {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #e74c3c;
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 3;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 10px;
            color: #fff;
        }

        .featured .card-title {
            font-size: 2.2rem;
        }

        .card-meta {
            font-size: 0.85rem;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .news-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 350px;
            }
            .news-card.featured {
                grid-row: span 1;
            }
            .featured .card-title { font-size: 1.6rem; }
        }

        /* Subscription Form Overlay */
        .subscribe-section {
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 60px 20px;
            text-align: center;
            border-radius: 24px;
            margin-top: 40px;
        }

        #newsletterForm {
            max-width: 500px;
            margin: 30px auto 0;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 600px) {
            #newsletterForm { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="logo.png" alt="Axom Cars Logo" class="logo" width="180">
                </a>
            </div>
            <nav class="header-nav">
                <a href="index.html">Home</a>
                <a href="cars.html">Cars</a>
                <a href="workshops.html">Workshops</a>
                <a href="finance.html">Finance</a>
                <a href="newsletter.html" class="active">Newsletter</a>
            </nav>
        </div>
    </header>

    <div class="newsroom-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; border-bottom: 2px solid #f0f0f0; padding-bottom: 20px;">
            <h1 style="font-weight: 700; color: #1a1a1a; margin: 0;">Newsroom</h1>
            <p style="color: #666; margin: 0;">Inside Axom Cars & Tata Motors</p>
        </div>
        
        <div class="news-grid" id="newsGrid">
            <!-- Dynamic Stories will be injected here -->
            <p>Gathering the latest stories...</p>
        </div>

        <div class="subscribe-section">
            <h2 style="font-weight: 700;">Never Miss a Story</h2>
            <p style="color: #666;">Get exclusive updates and offers delivered directly to your inbox.</p>
            
            <div id="statusBox" style="display: none; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 500px;"></div>
            
            <form id="newsletterForm">
                <input type="email" id="subEmail" placeholder="Enter your email address" required style="flex: 1; padding: 15px 20px; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; font-size: 1rem;">
                <button type="submit" style="background: #1d70b8; color: #fff; padding: 15px 30px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s;">Subscribe</button>
            </form>
        </div>
    </div>

    <footer class="footer" style="margin-top: 100px;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Axom Cars. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        // 1. Fetch and Render Stories
        async function loadNewsroom() {
            const grid = document.getElementById('newsGrid');
            
            try {
                const { data: stories, error } = await window.supabaseClient
                    .from('stories')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) throw error;

                if (!stories || stories.length === 0) {
                    grid.innerHTML = '<div style="grid-column: span 2; text-align: center; padding: 40px; color: #888;"><h3>No stories found.</h3><p>We are currently preparing exciting updates for you!</p></div>';
                    return;
                }

                grid.innerHTML = stories.map((story, index) => {
                    const isFeatured = index === 0;
                    const date = new Date(story.created_at).toLocaleDateString('en-GB', { 
                        day: 'numeric', month: 'long', year: 'numeric' 
                    });
                    
                    return `
                        <a href="${story.cta_link || '#'}" class="news-card ${isFeatured ? 'featured' : ''}">
                            ${isFeatured ? '<div class="tag-latest">Latest</div>' : ''}
                            <div class="card-bg" style="background-image: url('${story.image_url || 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&q=80'}')"></div>
                            <div class="card-overlay"></div>
                            <div class="card-content">
                                <h2 class="card-title">${story.title}</h2>
                                <div class="card-meta">${date} | Axom Cars</div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (err) {
                console.error("Newsroom error:", err);
                grid.innerHTML = '<p>Oops! We couldn\'t load the newsroom. Please try again later.</p>';
            }
        }

        // 2. Handle Subscription
        const subForm = document.getElementById('newsletterForm');
        const statusBox = document.getElementById('statusBox');

        subForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('subEmail').value;
            const btn = subForm.querySelector('button');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusBox.style.display = 'none';

            try {
                const { data, error } = await window.supabaseClient.functions.invoke('newsletter-handler', {
                    body: { action: 'subscribe', email: email }
                });

                if (error) throw error;

                statusBox.innerHTML = data.message;
                statusBox.style.display = 'block';
                statusBox.style.backgroundColor = '#d4edda';
                statusBox.style.color = '#155724';
                subForm.reset();
            } catch (err) {
                console.error(err);
                statusBox.innerHTML = "Error: " + (err.message || 'Something went wrong');
                statusBox.style.display = 'block';
                statusBox.style.backgroundColor = '#f8d7da';
                statusBox.style.color = '#721c24';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Subscribe';
            }
        });

        // Start
        loadNewsroom();
    </script>
</body>
</html>
